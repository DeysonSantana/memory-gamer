<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo do App Icon -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="45%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <!-- Borda Neon Neon Cyan/Purple -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <!-- Gradiente da Placa de Memória RAM -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09203f"/>
      <stop offset="100%" stop-color="#537895"/>
    </linearGradient>

    <!-- Gradiente dos Chips de Memória -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente dos Pinos Dourados de Contato -->
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Filtro de Glow Neon -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Corpo do Ícone (App Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)" stroke="url(#neonBorder)" stroke-width="14"/>

  <!-- Glow Circular Central de Fundo -->
  <circle cx="256" cy="256" r="176" fill="#0d1424" stroke="rgba(255, 255, 255, 0.06)" stroke-width="4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-dasharray="6 8" stroke-width="2"/>

  <!-- Cartas Duplas Holográficas no Fundo (Par de Memória) -->
  <g opacity="0.35">
    <!-- Carta Esquerda (Inclinada -12deg) -->
    <rect x="130" y="145" width="115" height="165" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="4" transform="rotate(-12 187 227)"/>
    <!-- Carta Direita (Inclinada +12deg) -->
    <rect x="267" y="145" width="115" height="165" rx="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="4" transform="rotate(12 324 227)"/>
  </g>

  <!-- ==================== PENTE DE MEMÓRIA RAM CENTRAL ==================== -->
  <g transform="translate(0, 10)">
    <!-- Trilha / Glow do Módulo de Memória -->
    <rect x="74" y="206" width="364" height="120" rx="14" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glowFilter)" opacity="0.6"/>

    <!-- PCB Principal da Memória RAM -->
    <rect x="76" y="208" width="360" height="116" rx="12" fill="url(#pcbGrad)" stroke="#38bdf8" stroke-width="3"/>

    <!-- Detalhe chanfrado superior da barra de memória -->
    <path d="M 86 214 L 140 214 L 150 224 L 362 224 L 372 214 L 426 214" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

    <!-- 4 Células / Chips de Memória Flash/RAM -->
    <!-- Chip 1 -->
    <rect x="100" y="228" width="64" height="66" rx="6" fill="url(#chipGrad)" stroke="#475569" stroke-width="2"/>
    <circle cx="112" cy="240" r="3" fill="#00f2fe"/>
    <line x1="118" y1="270" x2="146" y2="270" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>

    <!-- Chip 2 -->
    <rect x="178" y="228" width="64" height="66" rx="6" fill="url(#chipGrad)" stroke="#475569" stroke-width="2"/>
    <circle cx="190" cy="240" r="3" fill="#00f2fe"/>
    <line x1="196" y1="270" x2="224" y2="270" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>

    <!-- Chip 3 -->
    <rect x="270" y="228" width="64" height="66" rx="6" fill="url(#chipGrad)" stroke="#475569" stroke-width="2"/>
    <circle cx="282" cy="240" r="3" fill="#00f2fe"/>
    <line x1="288" y1="270" x2="316" y2="270" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>

    <!-- Chip 4 -->
    <rect x="348" y="228" width="64" height="66" rx="6" fill="url(#chipGrad)" stroke="#475569" stroke-width="2"/>
    <circle cx="360" cy="240" r="3" fill="#00f2fe"/>
    <line x1="366" y1="270" x2="394" y2="270" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>

    <!-- Trilhas / Barramento de Dados Neon -->
    <path d="M 132 216 L 132 228 M 210 216 L 210 228 M 302 216 L 302 228 M 380 216 L 380 228" stroke="#00f2fe" stroke-width="2" filter="url(#glowFilter)"/>

    <!-- Pinos Dourados de Contato na Parte Inferior com o Encaixe / Chanfro Central (Notch DDR) -->
    <!-- Pinos Bloco Esquerdo -->
    <rect x="96" y="318" width="144" height="14" rx="2" fill="url(#goldPins)"/>
    <line x1="114" y1="318" x2="114" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="132" y1="318" x2="132" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="150" y1="318" x2="150" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="168" y1="318" x2="168" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="186" y1="318" x2="186" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="204" y1="318" x2="204" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="222" y1="318" x2="222" y2="332" stroke="#0f172a" stroke-width="3"/>

    <!-- Chanfro de Encaixe Central (Notch de Memória) -->
    <rect x="244" y="314" width="24" height="20" fill="#0d1424" rx="3"/>

    <!-- Pinos Bloco Direito -->
    <rect x="272" y="318" width="144" height="14" rx="2" fill="url(#goldPins)"/>
    <line x1="290" y1="318" x2="290" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="308" y1="318" x2="308" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="326" y1="318" x2="326" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="344" y1="318" x2="344" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="362" y1="318" x2="362" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="380" y1="318" x2="380" y2="332" stroke="#0f172a" stroke-width="3"/>
    <line x1="398" y1="318" x2="398" y2="332" stroke="#0f172a" stroke-width="3"/>
  </g>

  <!-- Emblema de Sucesso / Brilho Neon de Aprendizagem -->
  <circle cx="396" cy="116" r="32" fill="#00e676" filter="url(#glowFilter)"/>
  <polygon points="396,96 401,111 416,116 401,121 396,136 391,121 376,116 391,111" fill="#040810"/>
</svg>
